<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- 队友原有脚本（顺序不变） -->
  <script defer src="js/posts.js"></script>
  <script defer src="js/home.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/detail.js"></script>
  <script defer src="js/app.js"></script>
  <!-- 交接新增：你的业务逻辑脚本 -->
  <script defer src="js/manage.js"></script>
  <script defer src="js/publish.js"></script>
  <script defer src="js/my.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#home"><span aria-hidden="true">⌂</span> 校园失物招领</a>
      <span class="header-note">让物品回到主人手里</span>
    </header>
    <main id="main-content">
      <p id="source-note" class="source-note" role="status"></p>
      <section id="page-home" class="page" aria-labelledby="home-heading">
        <div class="hero">
          <h1 id="home-heading">校园里的失物，在这里找</h1>
          <p>集中浏览寻物与招领信息，找到线索后联系发布者。</p>
          <a class="search-entry" href="#search"><span aria-hidden="true">⌕</span> 搜索校园卡、钥匙、雨伞等物品</a>
        </div>
        <div class="quick-actions">
          <!-- 交接改动：移除 disabled 和“暂未开放”文案 -->
          <button class="quick lost" type="button" data-publish-type="lost">
            <strong>🔎 我丢了东西</strong><span>发布寻物</span>
          </button>
          <button class="quick found" type="button" data-publish-type="found">
            <strong>📦 我捡到东西</strong><span>发布招领</span>
          </button>
        </div>
        <div class="section">
          <div class="section-head">
            <h2>最新信息</h2>
            <div class="tabs" id="home-tabs" role="group" aria-label="信息类型">
              <button class="tab active" type="button" data-type="all" aria-pressed="true">全部</button>
              <button class="tab" type="button" data-type="lost" aria-pressed="false">寻物</button>
              <button class="tab" type="button" data-type="found" aria-pressed="false">招领</button>
            </div>
          </div>
          <form class="filter-form" id="home-filter-form">
            <label>物品类别<select id="home-category"><option value="">全部类别</option></select></label>
            <label>丢失 / 拾取地点<input id="home-place" type="search" maxlength="100" placeholder="例如：图书馆"></label>
            <button class="filter-button" type="submit">筛选</button>
            <button class="text-button" type="button" id="home-reset">重置</button>
          </form>
          <p class="result-note" id="home-count" aria-live="polite"></p>
          <div class="list" id="home-list"></div>
        </div>
      </section>
      <section id="page-search" class="page" hidden aria-labelledby="search-heading">
        <div class="hero">
          <h1 id="search-heading">搜索物品</h1>
          <p>按名称、类别、地点或物品特征查找，多词搜索用空格分隔。</p>
          <form id="search-form">
            <label class="search-label" for="search-keyword">物品关键词</label>
            <div class="search-box">
              <input id="search-keyword" type="search" maxlength="200" placeholder="例如：黑色 雨伞" autocomplete="off">
              <button class="filter-button" type="submit">搜索</button>
            </div>
            <div class="chips" id="search-chips" role="group" aria-label="常用搜索词">
              <button class="chip" type="button" data-keyword="校园卡">校园卡</button>
              <button class="chip" type="button" data-keyword="钥匙">钥匙</button>
              <button class="chip" type="button" data-keyword="雨伞">雨伞</button>
              <button class="chip" type="button" data-keyword="耳机">耳机</button>
            </div>
            <div class="filter-form search-filters">
              <label>信息类型<select id="search-type"><option value="all">全部类型</option><option value="lost">寻物</option><option value="found">招领</option></select></label>
              <label>物品类别<select id="search-category"><option value="">全部类别</option></select></label>
              <label>丢失 / 拾取地点<input id="search-place" type="search" maxlength="100" placeholder="例如：图书馆"></label>
            </div>
            <div class="search-options">
              <label class="checkbox-label"><input id="search-finished" type="checkbox">包括已结束的信息</label>
              <button class="text-button" type="button" id="search-reset">清空条件</button>
            </div>
          </form>
        </div>
        <div class="section">
          <p class="result-note" id="search-note" aria-live="polite"></p>
          <div class="list" id="search-list"></div>
        </div>
      </section>
      <section id="page-detail" class="page" hidden aria-labelledby="detail-heading">
        <div class="page-top">
          <a id="detail-back" class="back-link" href="#home">‹ 返回列表</a>
          <h1 id="detail-heading">信息详情</h1>
        </div>
        <div id="detail-content" class="detail-content"></div>
      </section>
      <!-- 交接新增：你的三个功能页面节点 -->
      <section id="page-publish" class="page" hidden>
        <h2>发布信息</h2>
        <div id="publish-form-area"></div>
      </section>
      <section id="page-success" class="page" hidden>
        <h2>发布成功</h2>
        <div id="success-content"></div>
      </section>
      <section id="page-my" class="page" hidden>
        <h2>我的发布</h2>
        <div id="my-list"></div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="主要导航">
      <a class="nav-link active" href="#home" data-page="home" aria-current="page"><b aria-hidden="true">⌂</b>首页</a>
      <a class="nav-link" href="#search" data-page="search"><b aria-hidden="true">⌕</b>搜索</a>
      <!-- 交接改动：改为可点击链接，移除 disabled -->
      <a class="nav-link" href="#publish" data-page="publish"><b aria-hidden="true">＋</b>发布</a>
      <a class="nav-link" href="#my" data-page="my"><b aria-hidden="true">◎</b>我的</a>
    </nav>
  </div>
  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  <noscript><p class="empty">请在 Chrome 中启用 JavaScript 后重新打开页面。</p></noscript>
</body>
</html>
